[project]
name = "signup-fixture-lab"
version = "0.1.0"
description = "Bulk test-account seeder, signup-abuse detector, mock API and load engine for your own app. Stdlib only."
readme = "README.md"
requires-python = ">=3.11"
# No runtime dependencies on purpose: this has to run in a bare CI image and on
# a staging box with no network access.
dependencies = []

[project.optional-dependencies]
# Everything below is optional convenience; `make test`/`seed`/`load` never need it.
dev = ["ruff>=0.6", "pytest>=8"]

[project.scripts]
seed-accounts = "seeds.seed:main"
signup-scan = "abuse.detector:main"
fixture-api = "mockapi.server:main"
fixture-load = "load.engine:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E741", "RET504", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"seeds/corpus.py" = ["E501"]  # user-agent literals are opaque and must stay verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["seeds", "abuse", "mockapi", "load"]

[tool.setuptools.package-data]
seeds = ["schema.sql"]
